version: '3.8'
services:
  voicevox_engine:
    # VOICEVOX Engine Docker image (GPU version)
    # voicevox-v1 モデルを使う場合のみ必要。
    # openjtalk-v1 / piper-v1 のみ使う場合はこのサービスをコメントアウト可能。
    image: voicevox/voicevox_engine:nvidia-latest
    ports:
      - '50021:50021'
    tty: true
    # Enable GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    # Health monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50021/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  openai_tts_api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - VOICEVOX_ENGINE_URL=http://voicevox_engine:50021
      # APIキー認証 (省略時は認証なし / ローカル開発モード)
      # 公開環境では必ず設定してください。
      # - API_KEY=your_secret_api_key_here
    # voicevox-v1 を使う場合は depends_on を有効化してください。
    # openjtalk-v1 / piper-v1 のみの場合はコメントアウト可能。
    # depends_on:
    #   voicevox_engine:
    #     condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
