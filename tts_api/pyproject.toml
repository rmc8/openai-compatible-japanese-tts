[project]
name = "japanese-tts-api"
version = "0.2.1"
package = false
description = "OpenAI-compatible Japanese TTS API supporting VOICEVOX, Open JTalk, and Piper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.5",
    "httpx>=0.24.0",
    "python-jose[cryptography]>=3.3.0",
    "numpy",
    "pyopenjtalk",
]


